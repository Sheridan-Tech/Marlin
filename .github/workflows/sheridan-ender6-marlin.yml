name: Sheridan Ender 6 — Marlin 2.1.3 DWIN build

on:
  workflow_dispatch:
  push:
    branches:
      - ender6-marlin-2.1.3-dwin-arc
      - ender6-upstream-eval

permissions:
  contents: read

jobs:
  compile-ender6:
    name: Compile STM32F103RE Creality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'
      - name: Assert Ender 6 safety profile
        run: python test/sheridan_ender6_config.py
      - name: Build firmware
        run: pio run -e STM32F103RE_creality
      - name: Upload UNVALIDATED firmware build
        uses: actions/upload-artifact@v4
        with:
          name: ender6-marlin-2.1.3-b3-dwin-arc-UNVALIDATED
          path: .pio/build/STM32F103RE_creality/*.bin
          if-no-files-found: error
